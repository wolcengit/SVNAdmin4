name: Release

# 打 v* 标签（如 v4.1.0）时触发：构建多架构二进制与 Docker 镜像并发布到 GitHub Release / GHCR。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wolcengit/svnadmin4

jobs:
  # ---------- 构建 linux/amd64 + arm64 二进制并直接发布 GitHub Release ----------
  build-and-release:
    name: 构建二进制并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 推导版本元数据
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: 编译 linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-X 'svnadmin/internal/version.Version=${{ steps.meta.outputs.version }}' -X 'svnadmin/internal/version.GitCommit=${{ steps.meta.outputs.commit }}' -X 'svnadmin/internal/version.BuildTime=${{ steps.meta.outputs.built }}'"
          cd server && go build -ldflags "$LDFLAGS" -o ../build/svnadmin4 .
          cd ../build && tar -czf "svnadmin4_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz" svnadmin4
      - name: 编译 linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-X 'svnadmin/internal/version.Version=${{ steps.meta.outputs.version }}' -X 'svnadmin/internal/version.GitCommit=${{ steps.meta.outputs.commit }}' -X 'svnadmin/internal/version.BuildTime=${{ steps.meta.outputs.built }}'"
          cd server && go build -ldflags "$LDFLAGS" -o ../build/svnadmin4 .
          cd ../build && tar -czf "svnadmin4_${{ steps.meta.outputs.version }}_linux_arm64.tar.gz" svnadmin4
      - name: 生成校验和
        run: cd build && sha256sum *.tar.gz > checksums.txt && ls -l
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.tar.gz
            build/checksums.txt
          generate_release_notes: true

  # ---------- 构建并推送多架构镜像到 GHCR ----------
  build-image:
    name: 构建并推送镜像 (amd64/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 派生镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: 设置构建参数
        run: |
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          RAW_VERSION="${{ github.ref_name }}"
          echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_TIME=${{ env.BUILT }}
