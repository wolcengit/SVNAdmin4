name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: 静态检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 许可头校验
        run: bash scripts/check-license.sh

      - name: gofmt 检查
        run: |
          cd server
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未 gofmt："; echo "$out"; exit 1; fi

      - name: go vet
        run: cd server && go vet ./...

      - name: 构建后端
        run: cd server && go build -o ../build/svnadmin4 .

      - name: 前端依赖与类型检查
        run: cd web && npm install && npm run type-check

      - name: 前端构建
        run: cd web && npm run build

  smoke:
    name: 接口冒烟
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装 Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion subversion-tools

      - name: 构建并启动
        run: |
          cd server
          go build -o ../build/svnadmin4 .
          ../build/svnadmin4 -c ./configs/config.yaml -web "" &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/common/verifyOption >/dev/null && break
            sleep 1
          done

      - name: 冒烟测试
        run: bash scripts/smoke.sh 8080
